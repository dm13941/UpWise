name: upwise_app
description: A mentorship platform built with Flutter and Supabase
publish_to: "none"

version: 1.0.1+2

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # Навигация и управление состоянием
  go_router: ^16.2.4
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Supabase
  supabase_flutter: ^2.5.8

  # Локализация и intl
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # UI и иконки
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10

  # Хранение данных
  shared_preferences: ^2.5.3

  # HTTP-запросы
  http: ^1.2.2

  # Анимации
  animations: ^2.0.11

  # Push уведомления
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  firebase_crashlytics: ^4.0.3

  # URL launcher для внешних ссылок
  url_launcher: ^6.3.1
  
  # Google Sign-In
  google_sign_in: ^6.2.1
  googleapis_auth: ^1.4.1
  
  # Кэширование изображений
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1
  
  # Работа с медиа (камера, галерея)
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  
  # Сжатие изображений
  flutter_image_compress: ^2.3.0
  
  # Работа с путями файлов
  path_provider: ^2.1.4
  path: ^1.9.0
  
  # Environment variables
  flutter_dotenv: ^5.1.0
  
  # Криптография для подписей платежей
  crypto: ^3.0.5
  
  # Безопасное хранилище для токенов
  flutter_secure_storage: ^9.0.0
  
  # Shimmer эффект для skeleton screens
  shimmer: ^3.0.0
  
  # Offline mode
  connectivity_plus: ^6.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # WebRTC для видеозвонков (Removed)
  # flutter_webrtc: ^1.2.0 (Removed)
  local_auth: ^3.0.0
  table_calendar: ^3.2.0
  flutter_native_splash: ^2.4.7
  google_fonts: ^6.3.3
  video_player: ^2.10.1
  read_pdf_text: ^0.3.1
  archive: ^4.0.7
  google_generative_ai: ^0.4.7
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.7
  json_annotation: ^4.8.1
  json_serializable: ^6.7.1
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_main"
  ios: true
  web:
    generate: true
    image_path: "assets/images/logos/upwise_logo.png"
    background_color: "#0A192F"
    theme_color: "#0A192F"
  remove_alpha_ios: true
  image_path: "assets/images/logos/app_icon_ios.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logos/app_icon_android_fg.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/logos/app_icon_ios.png"

  color_dark: "#FFFFFF"
  image_dark: "assets/images/logos/app_icon_ios.png"

  web: true

  android_12:
    image: "assets/images/logos/app_icon_android_fg.png"
    icon_background_color: "#FFFFFF"
    color: "#FFFFFF"

flutter:
  generate: true
  uses-material-design: true

  # ✅ Ассеты (всё объединено в одну секцию)
  assets:
    - assets/images/
    - assets/images/logos/
    - assets/images/payment_methods/

    - .env